<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BeautyStyle｜掲載内容のご確認</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9f7;color:#493d35;font-family:sans-serif}#gate{max-width:470px;margin:15vh auto;padding:36px 28px;background:#fff;border-top:3px solid #b49a6b;box-shadow:0 10px 45px #6a493010}h1{font-family:serif;font-size:25px}p{line-height:1.8;font-size:14px}input,button,select{padding:12px;font-size:16px;border:1px solid #ccbcb0;border-radius:4px}input{width:100%;margin:15px 0}button{background:#87324d;color:white;cursor:pointer}#bar{padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #dccbbc}#bar small{margin-left:auto}iframe{border:0;width:100%;height:calc(100dvh - 80px);background:white}#error{color:#a32749}#review:not([hidden]){display:flex;flex-direction:column;height:100dvh}#review iframe{flex:1;min-height:0;height:auto}#bar,details{flex-shrink:0}</style><section id="gate"><p>BeautyStyle / PRIVATE PREVIEW</p><h1>本体サイト改修案のご確認</h1><p>以前の確認用パスワードをご入力ください。<br>料金・アナリスト・FAQ・トップ構成の下書きです。本番サイトには反映していません。</p><form id="unlock"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">確認ページを開く</button><p id="error" role="alert"></p></form></section><main id="review" hidden><iframe id="preview" title="本体サイト改修の下書き" style="height:100dvh"></iframe></main><script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let pages=null;window.currentDraft='index.html';
window.showDraft=function(target){const u=new URL(target,'https://preview.invalid/');const name=u.pathname.split('/').pop();if(!pages[name])return;window.currentDraft=target;document.getElementById('preview').srcdoc=pages[name];};
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;document.getElementById('error').textContent='';try{const enc=await(await fetch('./review.enc.json',{cache:'no-store'})).json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);pages=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.cipher))));document.getElementById('gate').hidden=true;document.getElementById('review').hidden=false;document.getElementById('password').value='';showDraft('index.html');}catch(err){document.getElementById('error').textContent='パスワードを確認して、もう一度お試しください。';}finally{btn.disabled=false}});
</script></html>
