<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約ボタン追加・現行デザイン確認用</title><style>body{margin:0;background:#eee;font-family:sans-serif}header{padding:12px;background:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{padding:10px}iframe{display:block;margin:12px auto;width:calc(100% - 24px);height:calc(100vh - 100px);border:0;background:white}</style><section id="gate" style="padding:40px;max-width:480px;margin:auto"><h1>予約ボタン追加案</h1><p>前回の確認用パスワードを入力してください。</p><form><input type="password" aria-label="パスワード" required><button>確認ページを開く</button><p id="error"></p></form></section><main hidden id="review"><header><b>未公開：現行サイト＋予約ボタン</b><select aria-label="店舗"><option value="bs-tokyo.html#price">東京本店</option><option value="bs-yokohama.html#price">横浜店</option><option value="bs-chiba.html#price">千葉店</option><option value="bs-omiya.html#price">大宮店</option><option value="bs-nagoya.html#price">名古屋店</option><option value="bs-osaka.html#price">大阪梅田店</option><option value="bs-osakashinsaibashi.html#price">大阪心斎橋店</option><option value="bs-kyoto.html#price">京都店</option><option value="bs-kobe.html#price">神戸店</option><option value="bs-fukuoka.html#price">福岡天神店</option></select><button id="pc">PC</button><button id="sp">スマホ390px</button></header><iframe title="店舗プレビュー" id="view"></iframe></main><script>
let pages;const f=document.querySelector('iframe'),sel=document.querySelector('select');function show(){f.srcdoc=pages[sel.value.split('#')[0]];f.onload=()=>f.contentDocument.querySelector('#price').scrollIntoView()}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const enc=await(await fetch('booking.enc.json')).json();const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.querySelector('input').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:600000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.cipher));pages=JSON.parse(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).text());document.querySelector('#gate').hidden=true;document.querySelector('#review').hidden=false;show()}catch(e){document.querySelector('#error').textContent='開けませんでした。パスワードをご確認ください。'}};sel.onchange=show;document.querySelector('#pc').onclick=()=>f.style.width='calc(100% - 24px)';document.querySelector('#sp').onclick=()=>f.style.width='min(390px,100%)';</script></html>
