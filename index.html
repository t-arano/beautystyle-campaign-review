<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BeautyStyle｜掲載内容のご確認</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9f7;color:#493d35;font-family:sans-serif}#gate{max-width:470px;margin:15vh auto;padding:36px 28px;background:#fff;border-top:3px solid #b49a6b;box-shadow:0 10px 45px #6a493010}h1{font-family:serif;font-size:25px}p{line-height:1.8;font-size:14px}input,button,select{padding:12px;font-size:16px;border:1px solid #ccbcb0;border-radius:4px}input{width:100%;margin:15px 0}button{background:#87324d;color:white;cursor:pointer}#bar{padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #dccbbc}#bar small{margin-left:auto}iframe{border:0;width:100%;height:calc(100dvh - 80px);background:white}#error{color:#a32749}</style><section id="gate"><p>BeautyStyle / PRIVATE PREVIEW</p><h1>掲載内容のご確認</h1><p>ご案内したパスワードをご入力ください。<br>本番公開前の確認用ページです。</p><form id="unlock"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">確認ページを開く</button><p id="error" role="alert"></p></form></section><main id="review" hidden><div id="bar"><strong>確認用・未公開</strong><label>店舗 <select id="store"></select></label><button id="lock">閉じる</button><small>予約ボタンは実際の予約サイトへ移動します</small></div><iframe id="preview" title="店舗ページの掲載下書き"></iframe></main><script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let data=null;
const names={'bs-tokyo':'目黒本店','bs-yokohama':'横浜店','bs-chiba':'千葉店','bs-omiya':'大宮店','bs-nagoya':'名古屋店','bs-osaka':'大阪梅田店','bs-osakashinsaibashi':'大阪心斎橋店','bs-kyoto':'京都店','bs-kobe':'神戸店','bs-fukuoka':'福岡天神店'};
function show(){let page=data.pages[document.getElementById('store').value];for(const [name,url] of Object.entries(data.assets))page=page.split('./campaign-assets/'+name).join(url);page=page.replace('</body>','<script>window.addEventListener("load",()=>setTimeout(()=>document.getElementById("campaign").scrollIntoView(),800));<'+ '/script></body>');document.getElementById('preview').srcdoc=page;}
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;document.getElementById('error').textContent='';try{const enc=await(await fetch('./review.enc.json')).json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);data=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.cipher))));const sel=document.getElementById('store');sel.replaceChildren();for(const [slug,name] of Object.entries(names)){const o=document.createElement('option');o.value=slug;o.textContent=name;sel.append(o)}document.getElementById('gate').hidden=true;document.getElementById('review').hidden=false;document.getElementById('password').value='';show();}catch(err){document.getElementById('error').textContent='パスワードを確認して、もう一度お試しください。';}finally{btn.disabled=false}});document.getElementById('store').addEventListener('change',show);document.getElementById('lock').addEventListener('click',()=>location.reload());
</script></html>
